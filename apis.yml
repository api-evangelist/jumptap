name: Jumptap
description: Jumptap was a mobile advertising and audience-targeting platform founded in 2005 and based
  in Cambridge, Massachusetts. It matched ads to signals such as time of day, carrier network, site content,
  and device type, helping app developers acquire users and helping developers and publishers maximize ad
  revenue. In August 2013 Jumptap was acquired by Millennial Media (valued at roughly $210-232M in stock);
  Millennial Media was subsequently acquired by AOL/Verizon and folded into what is now Yahoo. Jumptap no
  longer operates as an independent entity and publishes no developer portal, documentation, or public API.
